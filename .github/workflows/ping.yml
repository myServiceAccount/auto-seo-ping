name: SEO Ping

on:
  schedule:
    # Daily run
    - cron: "23 7 * * *"
    # Full re-submit every Sunday to keep all pages fresh in indexes
    - cron: "11 5 * * 0"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force submit all URLs to IndexNow"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Notify search engines
        run: |
          # Force re-submit all URLs every Sunday
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event.schedule }}" = "11 5 * * 0" ]; then
            python notify.py --force
          else
            python notify.py
          fi

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state"
          git push || true
