name: SEO Ping & Page Visitor

on:
  schedule:
    - cron: "23 7 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - notify
          - visit
      force:
        description: "Force submit all URLs to IndexNow"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  notify:
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch' && (inputs.task == 'both' || inputs.task == 'notify')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Notify search engines
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python notify.py --force
          else
            python notify.py
          fi

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state"
          git push || true

  visit:
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch' && (inputs.task == 'both' || inputs.task == 'visit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Visit all pages
        run: python visit.py


